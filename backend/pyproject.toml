[project]
name = "catchapaw-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "aiosqlite>=0.19",
]
[project.optional-dependencies]
dev = ["pytest>=8.2","pytest-asyncio>=0.23","httpx>=0.27","ruff>=0.4"]
